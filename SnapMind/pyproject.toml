[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "snapmind-desktop"
version = "0.1.0"
description = "Local-first screenshot, OCR, clipboard and knowledge workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6>=6.7,<6.9",
  "rapidocr_onnxruntime==1.4.4",
  "Pillow>=10,<12",
  "pypdf>=5,<6",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "opencv-python==4.11.0.86",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7", "psutil>=6,<8"]

[project.scripts]
snapmind = "snapmind.app:main"

[tool.setuptools]
packages = ["snapmind"]

[tool.setuptools.package-data]
snapmind = ["models-manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
