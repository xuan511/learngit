name: SnapMind Windows portable
on:
  workflow_dispatch:
  push:
    paths: ['SnapMind/**', '.github/workflows/snapmind-windows.yml']
  pull_request:
    paths: ['SnapMind/**', '.github/workflows/snapmind-windows.yml']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: SnapMind/requirements*.txt
      - name: Test and build portable folder
        shell: pwsh
        run: ./SnapMind/tools/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SnapMind-Windows-x64
          path: |
            SnapMind/dist/SnapMind-0.1.0-Windows-x64.zip
            SnapMind/dist/SnapMind-0.1.0-Windows-x64.zip.sha256
          if-no-files-found: error
